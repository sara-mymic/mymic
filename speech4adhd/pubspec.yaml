name: my_mic
description: "Speak aloud, speak with confidence. Practice talking with short prompts, a friendly chat buddy, and quick debates — for language practice, conversation prep, and anyone building speaking confidence."
publish_to: 'none'

version: 1.8.0+6

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^17.2.3
  flutter_sound: ^9.30.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  permission_handler: ^12.0.3
  shared_preferences: ^2.3.0
  lottie: ^3.1.2
  confetti: ^0.8.0
  path_provider: ^2.1.4
  record: ^6.2.0
  just_audio: ^0.10.5
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# Avoid objective_c native-assets framework with simulator platform tag (App Store 409).
dependency_overrides:
  path_provider_foundation: 2.5.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FF7A45"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon.png
    color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/default.env
  #   - assets/lottie/
  #   - assets/images/
